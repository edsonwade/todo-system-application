spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/todo_db
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      properties:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true

server:
  error:
    include-message: always
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, metrics,prometheus,info
  endpoint:
    health:
      show:
        details: always
